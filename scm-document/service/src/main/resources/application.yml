server:
  port: 8213

spring:
  application:
    name: scm-document
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_document
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.scmcloud.document: DEBUG
