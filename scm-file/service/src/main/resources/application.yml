server:
  port: 8201

spring:
  application:
    name: scm-file
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_system
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

storage:
  max-file-size: 536870912
  presigned-url-expiry: 30m
  virus-scan:
    enabled: false
    clamd-host: ${CLAMAV_HOST:localhost}
    clamd-port: ${CLAMAV_PORT:3310}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:scm-files}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.scmcloud.file: DEBUG
