security:
  signature:
    enabled: true
    default-version: HMAC-SHA256-V2
    allowed-clock-skew: 5m
    nonce-ttl: 5m
    nonce-key-prefix: "api:nonce:"
    whitelist:
      # ── Browser (SPA) prefix groups ──────────────────────────────────
      # The SPA calls these prefixes directly with a Bearer token. A browser
      # cannot compute the platform HMAC signature, so those groups are exempt
      # from X-Signature here and are authenticated by the JWT instead. This is
      # an explicit path grouping, not a blanket disable of the filter: every
      # prefix below that is not listed still requires a valid signature.
      - /auth/**
      - /system/**
      - /common/**
      - /scm-*/**

      - /platform-auth/**
      - /public/**
      - /actuator/**
      # Payment channels call without the platform HMAC headers; the payment
      # service verifies the Alipay RSA2 / WeChat Pay v3 signature instead.
      - /ecom-payment/api/v1/payments/callback/**
      # Carrier logistics callbacks verify their own HMAC-SHA256 signature in lms-tms.
      - /lms-tms/api/v1/tms-tracking/callback/**
    app-secrets:
      # SECURITY: Secrets MUST be provided via environment variables in production
      # Remove default values to enforce secure configuration
      web-app: ${API_SECRET_WEB_APP:}
      internal-service: ${API_SECRET_INTERNAL_SERVICE:}
  ip-access:
    enabled: true
    whitelist-only: false
    cache-max-size: 20000
    cache-ttl: 1m
    block-message: Request blocked by gateway policy
    forwarded-headers:
      - X-Forwarded-For
      - X-Real-IP
    trusted-proxies:
      - 10.0.0.0/8
      - 192.168.0.0/16
  identity:
    enabled: true
    identity-token-header: X-Identity-Token
    user-id-header: X-User-Id
    username-header: X-User-Name
    device-id-header: X-Device-Id
    roles-header: X-User-Roles
    user-id-claim: userId
    username-claim: username
    device-id-claim: deviceId
    # SECURITY: MUST be set via environment variable in production
    signature-secret: ${IDENTITY_SIGNATURE_SECRET:changeit-identity-secret}

# Browser CORS for gateway-direct mode (the SPA origin is not same-origin with
# the gateway there). Enforced by GatewayCorsConfig before authentication; see
# docs/operations/GATEWAY_PREFIX_ALIAS_MIGRATION.md for the migration notes.
cognora:
  gateway:
    cors:
      allowed-origins:
        # Origin *patterns*: http://localhost:* covers every local dev port.
        - http://localhost:*
        - http://192.168.0.121:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: false
    redis:
      enabled: true
    diskspace:
      enabled: true
