server:
  port: 8761

spring:
  main:
    web-application-type: reactive
  application:
    name: platform-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/db_user?stringtype=unspecified
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
    dynamic:
      enabled: false
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      discovery:
        enabled: true
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          # CORS is enforced by GatewaySecurityConfig (security filter chain) so the
          # preflight is answered before authentication. Allowed origins come from
          # cognora.gateway.cors.allowed-origins.
          routes:
            # Explicit routes must win over the discovery locator, which also
            # exposes /<service-id>/** for platform-auth and platform-system.
            - id: platform-auth
              uri: lb://platform-auth
              predicates:
                - Path=/platform-auth/**
              filters:
                - StripPrefix=1
              order: -1
            - id: platform-system
              uri: lb://platform-system
              predicates:
                - Path=/platform-system/**
              filters:
                - StripPrefix=1
              order: -1

            # ── Transitional legacy aliases ─────────────────────────────────
            # The SPA (cognora-aura-web) still calls the old /auth, /system,
            # /common and /scm-* prefixes. These aliases keep it working while the
            # services register under their canonical names. They are NOT the
            # target state: delete them once the frontend and the deployment use
            # the canonical prefixes (see
            # docs/operations/GATEWAY_PREFIX_ALIAS_MIGRATION.md).
            - id: alias-auth
              uri: lb://platform-auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-system
              uri: lb://platform-system
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-common
              uri: lb://platform-system
              predicates:
                - Path=/common/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-scm-product
              uri: lb://platform-product
              predicates:
                - Path=/scm-product/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-scm-inventory
              uri: lb://platform-inventory
              predicates:
                - Path=/scm-inventory/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-scm-order
              uri: lb://scm-order
              predicates:
                - Path=/scm-order/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-scm-warehouse
              uri: lb://scm-warehouse
              predicates:
                - Path=/scm-warehouse/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-scm-logistics
              uri: lb://lms-tms
              predicates:
                - Path=/scm-logistics/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-scm-supplier
              uri: lb://scm-supplier
              predicates:
                - Path=/scm-supplier/**
              filters:
                - StripPrefix=1
              order: -1
            - id: alias-scm-purchase
