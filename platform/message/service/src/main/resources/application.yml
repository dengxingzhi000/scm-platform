server:
  port: 8209

spring:
  application:
    name: scm-message
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_system?stringtype=unspecified
          username: ${DB_USERNAME:admin}
          password: ${DB_PASSWORD:admin123}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

security:
  crypto:
    aes-key: ${AES_KEY:c9Z1kz0y9o+uQLkRYq1LZFBOM3ZgUfNy}

logging:
  level:
    com.scmcloud.message: DEBUG
