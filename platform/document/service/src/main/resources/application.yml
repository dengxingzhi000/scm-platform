server:
  port: 8213

spring:
  application:
    name: scm-document
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_document?stringtype=unspecified
          username: ${DB_USERNAME:admin}
          password: ${DB_PASSWORD:admin123}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.scmcloud.document: DEBUG

security:
  crypto:
    aes-key: ${AES_KEY:c9Z1kz0y9o+uQLkRYq1LZFBOM3ZgUfNy}

dubbo:
  registry:
    address: nacos://${NACOS_SERVER:localhost:8848}
  consumer:
    check: false
