server:
  # 8201 belongs to scm-product; every deployment surface (compose, k8s,
  # scm-web, docs/api) already uses 8214.
  port: 8214

spring:
  application:
    name: platform-file
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_system?stringtype=unspecified
          username: ${DB_USERNAME:admin}
          password: ${DB_PASSWORD:admin123}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

storage:
  max-file-size: 536870912
  presigned-url-expiry: 30m
  virus-scan:
    enabled: false
    clamd-host: ${CLAMAV_HOST:localhost}
    clamd-port: ${CLAMAV_PORT:3310}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:scm-files}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.cognora.platform.file: DEBUG

security:
  crypto:
    aes-key: ${AES_KEY:c9Z1kz0y9o+uQLkRYq1LZFBOM3ZgUfNy}

dubbo:
  registry:
    address: nacos://${NACOS_SERVER:localhost:8848}
  protocol:
    name: dubbo
    port: -1
  consumer:
    check: false
