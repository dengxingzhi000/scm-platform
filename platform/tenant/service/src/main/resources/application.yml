server:
  port: 8212

spring:
  application:
    name: platform-tenant

  # Nacos service discovery and config center
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml

  # Datasource
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_tenant}?stringtype=unspecified
          username: ${DB_USERNAME:admin}
          password: ${DB_PASSWORD:changeme}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cognora.platform.tenant.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# XXL-Job
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDR:${XXL_JOB_ADMIN:http://localhost:8088/}}
    executor:
      appname: platform-tenant-executor
      port: 9993
      logpath: ${user.home}/logs/platform-tenant/xxl-job
      logretentiondays: 30
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}

# Seata distributed transaction
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ${spring.application.name}-tx-group
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      data-id: seataServer.properties
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_SERVER:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      cluster: default
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  client:
    rm:
      async-commit-buffer-limit: 10000
      report-retry-count: 5
      table-meta-check-enable: true
      report-success-enable: false
      saga-branch-register-enable: false
      saga-json-parser: fastjson
      lock:
        retry-interval: 10
        retry-times: 30
        retry-policy-branch-rollback-on-conflict: true
    tm:
      commit-retry-count: 5
      rollback-retry-count: 5
      degrade-check: false
      degrade-check-period: 2000
      degrade-check-allow-times: 10
    undo:
      data-validation: true
      log-serialization: jackson
      log-table: undo_log
      only-care-update-columns: true
    log:
      exceptionRate: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

cognora:
  tenant:
    # tenant_config 需要表达平台级配置（tenant_id IS NULL），MyBatis 的租户拦截器
    # 只能追加 tenant_id = '<uuid>' 谓词，无法表达 IS NULL。该表的租户隔离改由
    # TenantConfigServiceImpl 显式过滤（scope=TENANT 强制当前租户，scope=PLATFORM
    # 仅平台管理员可用）。
    exclude-tables:
      - tenant_config
  security:
    headers:
      content-type-options-enabled: true
      frame-options: DENY
      hsts-enabled: true
      hsts-max-age: 31536000
      hsts-include-subdomains: true

dubbo:
  registry:
    address: nacos://${NACOS_SERVER:localhost:8848}
  protocol:
    name: dubbo
    port: -1
  consumer:
    check: false
