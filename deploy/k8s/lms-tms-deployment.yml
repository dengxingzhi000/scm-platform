apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-tms
  namespace: scm-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-tms
  template:
    metadata:
      labels:
        app: lms-tms
    spec:
      containers:
        - name: lms-tms
          image: docker.io/scmcloud/lms-tms:latest
          ports:
            - containerPort: 8205
          envFrom:
            - configMapRef:
                name: scm-config
            - secretRef:
                name: scm-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8205
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8205
            initialDelaySeconds: 20
            periodSeconds: 5
