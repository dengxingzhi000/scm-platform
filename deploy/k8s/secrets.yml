apiVersion: v1
kind: Secret
metadata:
  name: scm-secrets
  namespace: scm-prod
type: Opaque
# NOTE: This file contains PLACEHOLDER values only.
# Never commit real credentials. Populate values from your secrets manager
# (e.g. `kubectl create secret` / SealedSecrets / SOPS) before applying.
# To encode: printf 'your-value' | base64
data:
  DB_USERNAME: QURNSU4=                # "ADMIN" placeholder - set to your real db user
  DB_PASSWORD: Q0hBTkdFLU1FLQ==        # "CHANGE-ME-" placeholder
  REDIS_PASSWORD: Q0hBTkdFLU1FLQ==     # "CHANGE-ME-" placeholder
  JWT_SECRET: Q0hBTkdFLU1FLQ==         # "CHANGE-ME-" placeholder (>=512 bits in prod)