apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-product
  namespace: scm-platform
  labels:
    app: scm-product
    tier: business
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scm-product
  template:
    metadata:
      labels:
        app: scm-product
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8201"
    spec:
      containers:
        - name: scm-product
          image: scm-platform/scm-product:latest
          ports:
            - containerPort: 8201
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: nacos-server
            - name: NACOS_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: nacos-namespace
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: db-host
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: db-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: redis-password
            - name: ELASTICSEARCH_URIS
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: elasticsearch-uris
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g -XX:+UseG1GC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8201
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8201
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scm-product
  namespace: scm-platform
spec:
  selector:
    app: scm-product
  ports:
    - port: 8201
      targetPort: 8201
      name: http
  type: ClusterIP
