apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-system
  namespace: scm-platform
  labels:
    app: platform-system
    tier: business
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-system
  template:
    metadata:
      labels:
        app: platform-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: platform-system
          image: scm-platform/platform-system:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: nacos-server
            - name: NACOS_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: nacos-namespace
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: db-host
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: db-password
            - name: API_SECRET_INTERNAL_SERVICE
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: api-secret-internal-service
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: redis-password
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g -XX:+UseG1GC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: platform-system
  namespace: scm-platform
spec:
  selector:
    app: platform-system
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP
