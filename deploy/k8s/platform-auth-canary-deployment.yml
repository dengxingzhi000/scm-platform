apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-auth-canary
  namespace: scm-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-auth
      track: canary
  template:
    metadata:
      labels:
        app: platform-auth
        track: canary
    spec:
      containers:
        - name: platform-auth
          image: docker.io/scmcloud/platform-auth:canary
          ports:
            - containerPort: 8106
          envFrom:
            - configMapRef:
                name: scm-config
            - secretRef:
                name: scm-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8106
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8106
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
