apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-inventory
  namespace: scm-platform
  labels:
    app: scm-inventory
    tier: business
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scm-inventory
  template:
    metadata:
      labels:
        app: scm-inventory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8202"
    spec:
      containers:
        - name: scm-inventory
          image: scm-platform/scm-inventory:latest
          ports:
            - containerPort: 8202
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: nacos-server
            - name: NACOS_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: nacos-namespace
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: db-host
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: db-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: redis-password
            - name: SEATA_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: scm-config
                  key: seata-server
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g -XX:+UseG1GC"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8202
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8202
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scm-inventory
  namespace: scm-platform
spec:
  selector:
    app: scm-inventory
  ports:
    - port: 8202
      targetPort: 8202
      name: http
  type: ClusterIP
