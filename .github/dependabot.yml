version: 2
updates:
  # Maven dependencies (Java)
  # The parent BOM lives at com.scm.parent/pom.xml — there is no repo-root pom.
  - package-ecosystem: "maven"
    directory: "/com.scm.parent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps"
      include: "scope"

  # npm dependencies (Frontend)
  - package-ecosystem: "npm"
    directory: "/scm-web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Docker
  # Disabled: there is no Dockerfile at the repo root. Dockerfiles live per
  # service under scm-*/Dockerfile and are pinned to the JDK base image via
  # the maven-build workflow. Re-enable per-service if automated base-image
  # bumps become useful.
