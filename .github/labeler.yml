# ─── Cross-cutting by area ─────────────────────────────────────────────
# 前端已拆分到 cognora-aura-web，本仓库不再有 frontend 标签。

infra:
  - changed-files:
      - any-glob-to-any-file: deploy/**/*

database:
  - changed-files:
      - any-glob-to-any-file:
          - 'scm-*/service/src/main/resources/db/migration/**'
          - 'scripts/db/**/*'
          - '**/application*.yml'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**/*'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'

build:
  - changed-files:
      - any-glob-to-any-file:
          - '**/pom.xml'
          - 'com.scm.parent/**/*'
          - 'docker-compose*.yml'
          - 'Dockerfile'

breaking-change:
  - changed-files:
      - any-glob-to-any-file:
          - 'scm-*/api/**/dto/**'
          - 'scm-*/api/**/*Api.java'
          - 'scm-*/service/src/main/resources/db/migration/**'
