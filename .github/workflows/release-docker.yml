name: Release — Docker Images to GHCR

# Triggered on every v* tag (e.g. v1.3.0, v1.4.0-rc.1).
# Builds every service with a Dockerfile and pushes to GitHub Container
# Registry (ghcr.io/<owner>/scm-platform/<service>). Then publishes (or
# updates) the matching GitHub Release with auto-generated notes.
#
# Required secrets / permissions: only `GITHUB_TOKEN` — no Docker Hub creds.
# Dockerfiles live at scm-<name>/Dockerfile (one per deployable service).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-services:
    name: Detect services with Dockerfile
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      - name: List services that ship a Dockerfile
        id: list
        run: |
          set -euo pipefail
          services=$(ls -d scm-*/Dockerfile 2>/dev/null \
            | xargs -I{} dirname {} \
            | sed 's|^\./||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Detected services:"
          echo "$services" | jq -r '.[]' | sed 's/^/  - /'

  build:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scm-platform/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=git-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-services, build]
    steps:
      - uses: actions/checkout@v7

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          body_path: CHANGELOG.md
