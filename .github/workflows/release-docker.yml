name: Release — Docker Images to GHCR

# Triggered on every v* tag (e.g. v1.3.0, v1.4.0-rc.1).
# Builds every service with a Dockerfile and pushes to GitHub Container
# Registry (ghcr.io/<owner>/scm-platform/<service>). Then publishes (or
# updates) the matching GitHub Release with auto-generated notes.
#
# Required secrets / permissions: only `GITHUB_TOKEN` — no Docker Hub creds.
# Dockerfiles live at scm-<name>/Dockerfile (one per deployable service).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-services:
    name: Detect services with Dockerfile
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      - name: List services that ship a Dockerfile
        id: list
        run: |
          set -euo pipefail
          services=$(ls -d scm-*/Dockerfile 2>/dev/null \
            | xargs -I{} dirname {} \
            | sed 's|^\./||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Detected services:"
          echo "$services" | jq -r '.[]' | sed 's/^/  - /'

  build:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21 (with Maven cache)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Two layouts — both are handled by building from com.scm.parent/pom.xml
      # (the only pom that lists every top-level scm-* module, so -am can pull
      # in scm-common-web, scm-system-api, etc. that each service depends on):
      #   - flat modules (scm-auth, scm-gateway): jar lands at <module>/target/*.jar
      #   - api/service split modules:            jar lands at <module>/service/target/*.jar
      # We select by artifactId, which works regardless of layout:
      #   - flat       -> artifactId is 'scm-{name}'
      #   - split      -> service artifactId is 'scm-{name}-service'
      - name: Build service JAR (Maven)
        run: |
          set -euo pipefail
          service="${{ matrix.service }}"
          if [ -d "${service}/service" ]; then
            aid="${service}-service"
          else
            aid="${service}"
          fi
          echo "Building ${service} (artifactId=${aid}) ..."
          mvn -q -B -DskipTests \
            -pl ":${aid}" -am \
            -f com.scm.parent/pom.xml \
            package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scm-platform/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=git-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-services, build]
    steps:
      - uses: actions/checkout@v7

      # Replace softprops/action-gh-release@v2 (which occasionally retries-out
      # with "Too many retries" while trying to verify a freshly-created
      # release) with a direct gh CLI call. The body is the full CHANGELOG.md
      # at release time, matching the original workflow's `body_path` setting.
      # generate_release_notes:true is approximated with `--notes-from-tag`,
      # which auto-populates a summary from annotated tag messages.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          # The tag's annotated message becomes the release title fallback;
          # if the tag is lightweight (no -m body) this gracefully falls back
          # to using the tag name itself. GitHub auto-marks the newest
          # non-prerelease as "latest", so we only pass --prerelease when
          # the tag name contains a '-'.
          TAG_MSG="$(git tag -l --format='%(contents:subject)' "$TAG" || true)"
          if [ -n "$TAG_MSG" ]; then
            gh release create "$TAG" \
              --title "$TAG_MSG" \
              --notes-file CHANGELOG.md \
              $( [ "$IS_PRERELEASE" = "true" ] && echo --prerelease || true )
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file CHANGELOG.md \
              $( [ "$IS_PRERELEASE" = "true" ] && echo --prerelease || true )
          fi
