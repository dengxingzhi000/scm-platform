name: SCM Platform CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: db_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize databases
        if: github.event_name == 'push'
        env:
          PG_ADMIN_USER: admin
          PG_ADMIN_PASSWORD: admin123
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          cd scripts/db && bash init-all-databases.sh

      - name: Validate schema — all tables must have tenant_id
        if: github.event_name == 'push'
        env:
          PGPASSWORD: admin123
        run: |
          for db in db_user db_org db_permission db_product db_inventory db_order db_warehouse db_logistics db_supplier db_purchase db_finance db_audit db_notify db_approval; do
            echo "Checking $db..."
            psql -h localhost -U admin -d "$db" -f scripts/db/ci_validate_tenant_id.sql || exit 1
          done

      - name: Build and Run Unit Tests (PR)
        if: github.event_name == 'pull_request'
        run: |
          mvn clean test-compile test -B -V -f com.scm.parent/pom.xml \
            -Dmaven.test.failure.ignore=true

      - name: Build, Test and Generate Coverage (Push)
        if: github.event_name == 'push'
        run: mvn clean verify -B -V -f com.scm.parent/pom.xml

      - name: Upload Coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          flags: unittests
          name: codecov-scm-platform

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        if: vars.SONAR_ORG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -f com.scm.parent/pom.xml \
            -Dsonar.projectKey=scm-platform \
            -Dsonar.organization=${{ vars.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache OWASP NVD database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd
          restore-keys: ${{ runner.os }}-owasp-nvd

      - name: Run OWASP Dependency Check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # OWASP plugin treats an empty NVD_API_KEY env as "key present but
          # invalid" and aborts. Strip the empty variable so the plugin
          # falls back to the cached feed. If the scan still cannot reach
          # NVD (no key + cold cache), the security-report artifact is
          # still uploaded for manual review; step-level continue-on-error
          # keeps PRs mergeable while we surface the gap via the report.
          if [ -z "${NVD_API_KEY}" ]; then
            unset NVD_API_KEY
            NVD_ARGS=""
          else
            NVD_ARGS="-DnvdApiKey=${NVD_API_KEY}"
          fi
          mvn org.owasp:dependency-check-maven:check \
            -f com.scm.parent/pom.xml \
            -DfailBuildOnCVSS=9 \
            ${NVD_ARGS}

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: target/dependency-check-report.html

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        service:
          - scm-auth
          - scm-gateway
          - scm-system
          - scm-product
          - scm-inventory
          - scm-order
          - scm-warehouse
          - scm-logistics
          - scm-supplier
          - scm-finance
          - scm-purchase
          - scm-approval
          - scm-audit
          - scm-notify
          - scm-tenant

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: |
          if [ -d "${{ matrix.service }}/service" ]; then
            mvn clean package -DskipTests -pl ../${{ matrix.service }}/service -am -f com.scm.parent/pom.xml
          else
            mvn clean package -DskipTests -pl ../${{ matrix.service }} -am -f com.scm.parent/pom.xml
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Deploy to dev namespace
        run: |
          kubectl set image deployment/scm-auth scm-auth=${{ secrets.DOCKERHUB_USERNAME }}/scm-auth:develop-${{ github.sha }} -n scm-dev
          kubectl set image deployment/scm-gateway scm-gateway=${{ secrets.DOCKERHUB_USERNAME }}/scm-gateway:develop-${{ github.sha }} -n scm-dev
          kubectl set image deployment/scm-system scm-system=${{ secrets.DOCKERHUB_USERNAME }}/scm-system:develop-${{ github.sha }} -n scm-dev
          kubectl rollout status deployment/scm-auth -n scm-dev
          kubectl rollout status deployment/scm-gateway -n scm-dev
          kubectl rollout status deployment/scm-system -n scm-dev

      - name: Verify deployment
        run: |
          kubectl get pods -n scm-dev -l app=scm-auth
          kubectl get pods -n scm-dev -l app=scm-gateway
          kubectl get pods -n scm-dev -l app=scm-system

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy to production namespace
        run: |
          kubectl set image deployment/scm-auth scm-auth=${{ secrets.DOCKERHUB_USERNAME }}/scm-auth:master-${{ github.sha }} -n scm-prod
          kubectl set image deployment/scm-gateway scm-gateway=${{ secrets.DOCKERHUB_USERNAME }}/scm-gateway:master-${{ github.sha }} -n scm-prod
          kubectl set image deployment/scm-system scm-system=${{ secrets.DOCKERHUB_USERNAME }}/scm-system:master-${{ github.sha }} -n scm-prod
          kubectl rollout status deployment/scm-auth -n scm-prod
          kubectl rollout status deployment/scm-gateway -n scm-prod
          kubectl rollout status deployment/scm-system -n scm-prod

      - name: Verify deployment
        run: |
          kubectl get pods -n scm-prod -l app=scm-auth
          kubectl get pods -n scm-prod -l app=scm-gateway
          kubectl get pods -n scm-prod -l app=scm-system