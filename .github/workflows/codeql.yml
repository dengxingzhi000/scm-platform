name: CodeQL Security Scan

# Scans Java (backend) and JavaScript/TypeScript (scm-web frontend) on every
# push to master/develop and on every PR. Results uploaded to the Security
# tab. Schedule run on Mondays for ongoing coverage of new advisories.
# https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/customizing-code-scanning

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            paths: '**/*.java'
          - language: javascript-typescript
            paths: 'scm-web/**'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # build-mode: 'manual' for Java — this monorepo's parent POM lives at
      # com.scm.parent/pom.xml, NOT at the repo root, so the default autobuild
      # for Java can't find any pom.xml and exits with "could not process any
      # of it". For JS/TS we use 'none' because there is no compile step.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          build-mode: ${{ matrix.language == 'java' && 'manual' || 'none' }}

      # CodeQL needs compiled .class files for data-flow / taint analysis on
      # Java. Build the whole reactor against the real parent POM so every
      # service module produces class output that CodeQL can index.
      - name: Set up JDK 21 (Java analysis only)
        if: matrix.language == 'java'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile all Java modules for CodeQL
        if: matrix.language == 'java'
        run: |
          set -euo pipefail
          mvn -B -DskipTests \
            -f com.scm.parent/pom.xml \
            -DskipITs \
            -Dmaven.javadoc.skip=true \
            -Dcheckstyle.skip=true \
            test-compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
