name: Auto-Label PRs

# Apply labels defined in .github/labeler.yml on every PR. Lets reviewers
# filter the queue by affected module/area at a glance and feeds the
# release.yml categorization for auto-generated Release Notes.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          fail-on-invalid-config: true
