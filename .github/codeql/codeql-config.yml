name: scm-platform CodeQL configuration

# scm-web/src/lib/api/generated holds openapi-generator output. AGENTS.md and
# scm-web/README.md both say "regenerate, never hand-edit", so the style and
# unused-import findings inside those files are generator-owned: patching them
# by hand would be reverted by the next `npm run generate:api`.
paths-ignore:
  - scm-web/src/lib/api/generated
