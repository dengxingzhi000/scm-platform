# SCM Platform - 完整开发环境
# 包含所有必需的中间件服务
# 使用说明: docker compose up -d

name: scm-platform

# ============================================================
# YAML 锚点：核心业务服务的公共环境与依赖（core profile 使用）
# ============================================================
x-core-service-env: &core-service-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER:-admin}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
  # scm-system 的读写分离数据源用这套变量（开发环境主从都指向同一个库）
  DB_MASTER_HOST: postgres
  DB_SLAVE1_HOST: postgres
  DB_SLAVE2_HOST: postgres
  # 每个服务的 application.yml 只声明了 spring.datasource.url，而 dynamic-datasource
  # 启动时要一个显式的 master 数据源；各服务的 MASTER_URL 在下面按库名单独给
  SPRING_DATASOURCE_DYNAMIC_PRIMARY: master
  SPRING_DATASOURCE_DYNAMIC_STRICT: "false"
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: ${POSTGRES_USER:-admin}
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-admin123}
  # 业务代码里有一批服务直接读 spring.data.redis.*，两套名字都给上
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-admin123}
  NACOS_SERVER: nacos:8848
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
  SEATA_ENABLED: "false"
  # https-redirect 会替换 Tomcat connector，把 server.port 覆盖成 http-port(8080)；
  # 代码里已改为默认关闭，这里显式关掉，保证当前已构建的镜像端口正确
  FROG_SECURITY_HTTPS_REDIRECT_ENABLED: "false"
  # Dubbo：容器各自独立网络命名空间，默认协议端口 20880 不会冲突；注册到同一个 Nacos
  DUBBO_REGISTRY_ADDRESS: nacos://nacos:8848
  DUBBO_CONSUMER_CHECK: "false"
  DUBBO_APPLICATION_QOS_ENABLE: "false"
  KAFKA_BOOTSTRAP: kafka:9092
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: admin
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
  # 多数服务的 application.yml 没有 rabbitmq/kafka 段，Spring 默认会连 localhost → 必须给显式的 SPRING_* 名字
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: admin
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
  # 访问令牌用 HS512 签名，secret 必须 >= 64 字节，且所有服务必须相同
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (>= 64 chars)}
  # 字段加解密（AES-128，16 字节 hex）；scm-system 启动时强依赖
  SECURITY_CRYPTO_AES_KEY: ${SECURITY_CRYPTO_AES_KEY:-6f1c2b9d4e8a7c3d5b2a1908f7e6d5c4}
  # order/warehouse/supplier 的 XxlJobConfig 拒绝空地址，指向调度中心即可（不要求可达）
  XXL_JOB_ADMIN: ${XXL_JOB_ADMIN:-http://scm-xxl-job:8080/xxl-job-admin}
  JAVA_TOOL_OPTIONS: "-Xmx320m -XX:MaxMetaspaceSize=192m"
  TZ: Asia/Shanghai

x-core-service: &core-service
  profiles: ["core"]
  depends_on:
    - nacos
    - postgres
    - redis
    - kafka
    - rabbitmq
  networks:
    - scm-network

services:
  # ============================================================
  # 服务注册与配置中心
  # ============================================================
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: scm-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      # 生产环境必须通过 NACOS_AUTH_TOKEN 环境变量覆盖
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: 512m
      JVM_XMX: 768m
      JVM_XMN: 512m
      JVM_MS: 128m
      JVM_MMS: 320m
      TOMCAT_ACCESSLOG_ENABLED: "false"
      TIME_ZONE: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      # Nacos 3.x 控制台独立端口
      - "8080:8080"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - scm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # PostgreSQL - 主数据库
  # ============================================================
  postgres:
    # 不用 alpine 变体：musl 版在部分宿主机上 initdb 写 postmaster.pid 会 EPERM
    image: postgres:18
    container_name: scm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: postgres
      # PostgreSQL 18 起数据目录改为 /var/lib/postgresql/<major>/docker
      PGDATA: /var/lib/postgresql/18/docker
      # 供 scripts/db/init-all-databases.sh 使用
      PG_ADMIN_USER: ${POSTGRES_USER:-admin}
      PG_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      # initdb 阶段临时实例只监听 unix socket，必须用 socket 目录而不是 localhost
      PG_HOST: /var/run/postgresql
      PG_PORT: 5432
      # 供 scripts/db/init-seata.sh 使用
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin123}
      DB_HOST: /var/run/postgresql
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-admin}
    ports:
      - "5432:5432"
    volumes:
      # PG18 官方镜像要求挂载 /var/lib/postgresql，而不是 .../data
      - postgres_data:/var/lib/postgresql
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
      # CI 校验脚本依赖已建好的业务表，首次初始化时必须跳过
      - /dev/null:/docker-entrypoint-initdb.d/ci_validate_tenant_id.sql:ro
    networks:
      - scm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis Sentinel - 高可用Redis集群
  # ============================================================
  redis:
    image: redis:8-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-master:/data
    ports:
      - "6379:6379"
    networks:
      - scm-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-slave-1:
    image: redis:8-alpine
    command: redis-server /usr/local/etc/redis/redis.conf --replicaof redis 6379
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis
    networks:
      - scm-network

  redis-slave-2:
    image: redis:8-alpine
    command: redis-server /usr/local/etc/redis/redis.conf --replicaof redis 6379
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf
    depends_on:
      - redis
    networks:
      - scm-network

  redis-sentinel-1:
    image: redis:8-alpine
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./deploy/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    depends_on:
      - redis
      - redis-slave-1
      - redis-slave-2
    networks:
      - scm-network

  redis-sentinel-2:
    image: redis:8-alpine
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./deploy/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    ports:
      - "26380:26379"
    depends_on:
      - redis
      - redis-slave-1
      - redis-slave-2
    networks:
      - scm-network

  redis-sentinel-3:
    image: redis:8-alpine
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./deploy/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    ports:
      - "26381:26379"
    depends_on:
      - redis
      - redis-slave-1
      - redis-slave-2
    networks:
      - scm-network

  # ============================================================
  # Kafka - 消息队列（KRaft 模式，Kafka 4.x 起不再依赖 ZooKeeper）
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:8.4.0
    container_name: scm-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - scm-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # RabbitMQ - 消息队列（可靠性）
  # ============================================================
  rabbitmq:
    # 不用 alpine 变体：Erlang/mnesia 在部分宿主机 volume 上写入会 eperm
    image: rabbitmq:4.4.0-management
    container_name: scm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - scm-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # Elasticsearch - 搜索引擎
  # ============================================================
  elasticsearch:
    image: elasticsearch:9.5.5
    container_name: scm-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - scm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: kibana:9.5.5
    container_name: scm-kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - scm-network

  # ============================================================
  # Seata - 分布式事务协调器
  # ============================================================
  seata-server:
    image: apache/seata-server:2.6.0
    container_name: scm-seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_IP: seata-server
      SEATA_PORT: 8091
      SEATA_CONFIG_NAME: file:/root/seata-config/registry
      SEATA_ENV: dev
    volumes:
      - ./config/seata:/root/seata-config
      - seata_logs:/root/logs/seata
    networks:
      - scm-network

  # ============================================================
  # XXL-Job - 分布式任务调度
  # ============================================================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.5.0
    container_name: scm-xxl-job
    ports:
      - "8088:8080"
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql-xxljob:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${XXLJOB_MYSQL_PASSWORD:-root}
    volumes:
      - xxljob_data:/data/applogs
    depends_on:
      - mysql-xxljob
    networks:
      - scm-network

  mysql-xxljob:
    image: mysql:9.7.4
    container_name: scm-mysql-xxljob
    environment:
      MYSQL_ROOT_PASSWORD: ${XXLJOB_MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: xxl_job
    volumes:
      - mysql_xxljob_data:/var/lib/mysql
      - ./config/xxl-job/tables_xxl_job.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - scm-network

  # ============================================================
  # Sentinel Dashboard - 流量控制
  # ============================================================
  sentinel:
    image: bladex/sentinel-dashboard:1.8.10
    container_name: scm-sentinel
    ports:
      - "8858:8858"
    networks:
      - scm-network

  # ============================================================
  # 监控 - Prometheus + Grafana
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: scm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - scm-network

  grafana:
    image: grafana/grafana:13.2.4
    container_name: scm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - scm-network

  # ============================================================
  # 链路追踪 - SkyWalking
  # ============================================================
  skywalking-oap:
    image: apache/skywalking-oap-server:10.4.0
    container_name: scm-skywalking-oap
    depends_on:
      - elasticsearch
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      SW_CORE_GRPC_PORT: 11800
      SW_CORE_REST_PORT: 12800
    ports:
      - "11800:11800"  # gRPC
      - "12800:12800"  # REST
    networks:
      - scm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:12800/internal/l7check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  skywalking-ui:
    image: apache/skywalking-ui:10.4.0
    container_name: scm-skywalking-ui
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      SW_ZIPKIN_ADDRESS: http://skywalking-oap:9412
    ports:
      - "8090:8080"
    networks:
      - scm-network

  # ============================================================
  # Canal - MySQL binlog 同步到 Elasticsearch
  # ============================================================
  # NOTE: Canal is a MySQL binlog replication tool and CANNOT work with PostgreSQL.
  # This project uses PostgreSQL as its primary database, so Canal is non-functional here.
  # For CDC (Change Data Capture) with PostgreSQL, consider using Debezium instead:
  #   - Debezium PostgreSQL connector reads WAL (Write-Ahead Log) natively
  #   - Integrate with Kafka Connect for real-time data streaming
  #   - See: https://debezium.io/documentation/reference/stable/connectors/postgresql.html
  #
  # If you only need MySQL CDC (e.g., for Nacos/XXL-Job MySQL instances), Canal can remain
# but reconfigure canal.instance.master.address to point to a MySQL instance.
# ============================================================

  # ============================================================
  # PgBouncer - 连接池
  # ============================================================
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: scm-pgbouncer
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    networks:
      - scm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Schema Registry - Kafka Schema管理
  # ============================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    container_name: scm-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    networks:
      - scm-network
    healthcheck:
      # 镜像里没有 curl/wget，只能用 bash 的 /dev/tcp 探活
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # ClickHouse - OLAP Columnar Database for Analytics
  # ============================================================
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:26.10-alpine
    container_name: scm-clickhouse-keeper
    networks:
      - scm-network

  clickhouse:
    image: clickhouse/clickhouse-server:26.10-alpine
    container_name: scm-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    depends_on:
      - clickhouse-keeper
    networks:
      - scm-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================
# 电商域服务（可选：docker compose --profile ecommerce up -d）
# 需先用 mvn package 生成各模块 service/target/*.jar
# ============================================================
  scm-member:
    profiles: ["ecommerce"]
    build:
      context: ./scm-member
    container_name: scm-member
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      REDIS_HOST: redis
      NACOS_SERVER: nacos:8848
    ports:
      - "8302:8302"
    depends_on:
      - postgres
      - redis
      - nacos
    networks:
      - scm-network

  scm-promotion:
    profiles: ["ecommerce"]
    build:
      context: ./scm-promotion
    container_name: scm-promotion
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      REDIS_HOST: redis
      NACOS_SERVER: nacos:8848
    ports:
      - "8303:8303"
    depends_on:
      - postgres
      - redis
      - nacos
    networks:
      - scm-network

  scm-payment:
    profiles: ["ecommerce"]
    build:
      context: ./scm-payment
    container_name: scm-payment
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      REDIS_HOST: redis
      NACOS_SERVER: nacos:8848
    ports:
      - "8304:8304"
    depends_on:
      - postgres
      - redis
      - nacos
    networks:
      - scm-network

  scm-order-center:
    profiles: ["ecommerce"]
    build:
      context: ./scm-order-center
    container_name: scm-order-center
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      REDIS_HOST: redis
      NACOS_SERVER: nacos:8848
    ports:
      - "8305:8305"
    depends_on:
      - postgres
      - redis
      - nacos
    networks:
      - scm-network

