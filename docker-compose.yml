  scm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ============================================================
# 持久化卷
# ============================================================
volumes:
  # 数据库
  postgres_data:
  mysql_xxljob_data:

  # 缓存与消息队列
  redis_data:
  kafka_data:
  rabbitmq_data:

  # 搜索引擎
  es_data:

  # 服务注册与配置
  nacos_data:
  nacos_logs:

  # 分布式事务与调度
  seata_logs:
  xxljob_data:

  # 监控
  prometheus_data:
  grafana_data:

  # Redis Sentinel
  redis-master:

  # ClickHouse
  clickhouse_data:

  # 其他

