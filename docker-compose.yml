# ============================================================
# 核心业务服务（可选：docker compose --profile core up -d）
#
# 需先在本机构建各模块的可执行 jar：
#   mvn clean install -DskipTests -f com.scm.parent/pom.xml
# 然后把仓库（含各模块 service/target/*.jar）同步到本目录再 up。
#
# 内存：本机 8G 跑不下全部服务（infra 已占约 4~5G），每个 JVM 限 320m 堆；
# 建议按需分批 `up -d`，或加 --scale 之前先看 `docker stats`。
# ============================================================
  scm-gateway:
    <<: *core-service
    build:
      context: ./scm-gateway
    container_name: scm-gateway
    environment:
      <<: *core-service-env
      SPRING_APPLICATION_NAME: scm-gateway
      # classpath 上 application.yaml / .yml 同时存在时端口会被盖成 8080，OS 环境变量优先级最高
      SERVER_PORT: 8761
      # 网关不做 URL→权限 的二次校验（它自己的 ApiSignatureFilter 负责入口校验），
      # 而 PermissionAccessAutoConfiguration 强依赖 SysPermissionServiceClient，网关里没有这个 Bean。
      SPRING_AUTOCONFIGURE_EXCLUDE: com.scmcloud.common.access.PermissionAccessAutoConfiguration
    ports:
      - "8761:8761"

  scm-auth:
    <<: *core-service
    build:
      context: ./scm-auth
    container_name: scm-auth
    environment:
      <<: *core-service-env
      # 网关路由写的是 lb://auth-service，注册名必须一致
      SPRING_APPLICATION_NAME: auth-service
      # classpath 上 application.yaml / .yml 同时存在时端口会被盖成 8080，OS 环境变量优先级最高
      SERVER_PORT: 8106
      # auth 的 application.yaml 默认开启 HTTPS 并引用 classpath:certs/auth-keystore.p12，
      # 仓库里没有这个密钥库；容器内由网关/前端走明文 HTTP，这里关掉 SSL
      SERVER_SSL_ENABLED: "false"
      # dynamic-datasource 需要显式 master，否则启动时 CannotFindDataSourceException
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:postgresql://postgres:5432/db_user?stringtype=unspecified
    ports:
      - "8106:8106"

  scm-system:
    <<: *core-service
    build:
      context: ./scm-system
    container_name: scm-system
    environment:
      <<: *core-service-env
      # 网关路由写的是 lb://system-service；权限/用户内部客户端也解析这个名字
      SPRING_APPLICATION_NAME: system-service
      # classpath 上 application.yaml / .yml 同时存在时端口会被盖成 8080，OS 环境变量优先级最高
      SERVER_PORT: 8081
      # dynamic-datasource 需要显式 master，否则启动时 CannotFindDataSourceException
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:postgresql://postgres:5432/db_user?stringtype=unspecified
      # system 用的是具名数据源（@DS），URL 写在 application.yaml 里，需逐个覆盖才能带上 stringtype
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_USER_URL: jdbc:postgresql://postgres:5432/db_user?stringtype=unspecified
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_ORG_URL: jdbc:postgresql://postgres:5432/db_org?stringtype=unspecified
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_PERMISSION_URL: jdbc:postgresql://postgres:5432/db_permission?stringtype=unspecified
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_APPROVAL_URL: jdbc:postgresql://postgres:5432/db_approval?stringtype=unspecified
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_AUDIT_URL: jdbc:postgresql://postgres:5432/db_audit?stringtype=unspecified
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_NOTIFY_URL: jdbc:postgresql://postgres:5432/db_notify?stringtype=unspecified
    ports:
      - "8081:8081"

  scm-product:
    <<: *core-service
    build:
      context: ./scm-product
    container_name: scm-product
    environment:
      <<: *core-service-env
      SPRING_APPLICATION_NAME: scm-product
      # classpath 上 application.yaml / .yml 同时存在时端口会被盖成 8080，OS 环境变量优先级最高
      SERVER_PORT: 8201
